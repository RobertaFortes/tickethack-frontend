<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickethack</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/header.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header id="header"></header>
    <main id="container-home">
        <h1>Explore the World effortlessly by train!</h1>
        <p>Compare, book and enjoy cheap prices for train tickets: your journey starts on Tickethack</p>

        <div id="cards">
            <div class="card1">
                <input type="text" placeholder="Departure" />
                <input type="text" placeholder="Arrival" />
                <input type="date" />
                <button id="searchBtn" class="button">Search</button>
            </div>

            <div class="card2">
                <img src="images/train.png" />
                <hr />
                <p>It's time to book your future trip</p>
            </div>
        </div>
    </main>
</body>
</html>
